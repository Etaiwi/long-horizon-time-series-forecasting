experiment:
  name: dlinear_reconstruction
  seed: 2021

data:
  dataset: ETTh1
  input_length: 336
  prediction_length: 96
  channels: 7
  task: multivariate_to_multivariate

model:
  name: DLinear
  moving_average: 25
  individual: false

training:
  optimizer: Adam
  objective: MSE
  learning_rate: 0.005
  learning_rate_schedule: type1
  batch_size: 32
  max_epochs: 10
  early_stopping_patience: 3

evaluation:
  metrics:
    - MSE
    - MAE
    - RMSE
  baselines:
    - last_value
    - seasonal_naive_24h
