[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "time-series-reconstruction"
version = "0.1.0"
description = "DLinear reconstruction and adaptive multiscale improvement on Weather"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "matplotlib>=3.9,<4",
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
    "torch==2.12.1",
]

[project.optional-dependencies]
notebook = [
    "ipykernel>=6.29,<7",
    "nbconvert>=7.16,<8",
]

[tool.setuptools.packages.find]
where = ["src"]
