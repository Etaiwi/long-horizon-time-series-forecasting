[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "time-series-reconstruction"
version = "0.1.0"
description = "Reproducible DLinear and PatchTST reconstruction study on ETTh1"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "matplotlib>=3.9,<4",
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "pyyaml>=6,<7",
    "scikit-learn>=1.5,<2",
    "torch==2.12.1",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29,<7",
    "jupyterlab>=4.2,<5",
    "pytest>=8.3,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
